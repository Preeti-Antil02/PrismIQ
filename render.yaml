services:
  - type: web
    name: prismiq-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATA_DIR
        value: published_briefs

  - type: cron
    name: prismiq-pipeline-cron
    env: python
    rootDir: backend
    schedule: "*/10 * * * *"  # Temporary 10-minute validation cadence
    buildCommand: pip install -r requirements.txt
    startCommand: python src/cron_runner.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PIPELINE_TRIGGER_MODE
        value: scheduled
      - key: PIPELINE_CADENCE_NAME
        value: 10-minute-validation
      - key: PIPELINE_CRON_SCHEDULE
        value: "*/10 * * * *"

