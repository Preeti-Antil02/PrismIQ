name: Trend Evolution Nightly Pipeline

on:
  schedule:
    # 01:30 UTC (07:00 IST), scheduled after the 00:00 UTC main pipeline completes
    - cron: '30 1 * * *'
  workflow_dispatch:

concurrency:
  group: trend-nightly
  cancel-in-progress: false

jobs:
  run-nightly-trends:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary numpy scikit-learn fastembed groq

      - name: Execute Incremental Trend Build
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL || secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - << 'EOF'
          import os
          import sys

          db_url = os.environ.get("DATABASE_URL")
          if not db_url:
              print("Error: DATABASE_URL write secret is required.")
              sys.exit(1)

          from backend.src.trend_build import run_trend_build

          success, summary = run_trend_build(
              db_url=db_url,
              dry_run=False,
              groq_api_key=os.environ.get("GROQ_API_KEY")
          )

          print("Nightly trend build results:")
          print(f"  Status: {'SUCCESS' if success else 'FAILED'}")
          print(f"  Stories Processed: {summary.get('stories_count')}")
          print(f"  Clusters Formed: {summary.get('clusters_count')}")
          print(f"  Active Cross Trends: {summary.get('cross_trends_count')}")
          print(f"  Active Storylines: {summary.get('storylines_count')}")

          if not success:
              print("Error: Nightly trend build failed.")
              sys.exit(1)

          print("Nightly trend evolution step completed successfully.")
          EOF
